name: Build and Release Lantern

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core tests & build Android APK
        run: ./gradlew :core:test :android:assembleDebug --no-daemon

      - name: Stage Android APK
        run: |
          mkdir -p release-assets
          cp android/build/outputs/apk/debug/android-debug.apk release-assets/Lantern-Android-debug.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-android
          path: release-assets/Lantern-Android-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (with jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Windows transfer tests
        shell: pwsh
        run: .\gradlew.bat :windows:test --tests dev.lantern.windows.TransferTest --no-daemon

      - name: Build standalone Windows x64 package
        shell: pwsh
        run: .\Build-Windows.ps1 -Jdk $env:JAVA_HOME

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: |
            core/build/test-results/test/
            windows/build/test-results/test/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-windows
          path: dist/Lantern-Windows-x64.zip

  publish-release:
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: lantern-android
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lantern-windows
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lantern ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Lantern ${{ github.ref_name }} — Personal Local NAS & Unlimited Google Photos Archive Sync

            ### Downloads
            - **Android (`Lantern-Android-debug.apk`)**: Install on both your **Hub** phone (e.g., Redmi K20 Pro) and **Sender** Android phones/tablets.
            - **Windows 11 x64 (`Lantern-Windows-x64.zip`)**: Extract and run `Lantern\Lantern.exe` directly (self-contained JDK 21 runtime included; no separate Java installation needed).

            ### Highlights
            - **Zero-Internet Local Wi-Fi Transfer**: Direct TLS 1.2/1.3 with automatic IPv4 & IPv6 link-local fallback (`15–20+ MB/s` pipelined 512 KB chunks).
            - **3 Easy Pairing Modes (Saved Permanently)**:
              1. **6-Digit Pairing Code** (easy typing on PC, no webcam needed)
              2. **Nearby Hubs** (1-click Connect -> Accept on Hub)
              3. **QR Code / Webcam / Saved QR Image / Full Pairing Link**
            - **SHA-256 Deduplication & Byte-Exact Resume**: Skips existing or renamed files with `0` uploaded bytes and resumes interrupted videos cleanly.
            - **Personal NAS + USB SSD Safe**: Pauses safely on SSD removal or low storage without ever falling back silently to internal storage.
          files: |
            release-assets/Lantern-Android-debug.apk
            release-assets/Lantern-Windows-x64.zip
